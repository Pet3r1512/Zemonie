<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/svg+xml" href="/zemonie-favicon-16.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zemonie is the all-in-one money management tool for Gen Z. Track income, label expenses, and visualise your financial data — free and privacy-first."
    />
    <link rel="canonical" href="https://www.zemonie.site" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"

    />
    <title>Zemonie - Finance Assistant for Gen Z</title>
    <script>
      (function () {
        var theme = localStorage.getItem("theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="b7bc4a72-d4f3-46c5-aa0e-2f345ae6c4f9"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
