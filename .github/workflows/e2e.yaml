name: E2E
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" #3AM UTC
  pull_request:
    types: [labeled]
    path:
      - "client/**"
      - "server/**"
jobs:
  e2e:
    if: github.event_name == 'schedule' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING}}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile

      - name: Create server dev varsr
        run: |
          cat > server/.dev.vars <<EOF
          NODE_ENV=development
          DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL=http://localhost:8787
          TRUSTED_ORIGIN=http://localhost:5173
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          BREVO_API=${{ secrets.BREVO_API }}
          EOF

      - run: cd client && pnpm exec playwright install --with-deps chromium
      - run: cd client && pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7
