name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - uses: millionco/react-doctor@v2
        with:
          directory: client

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # SERVER
      - name: Generate Prisma client
        run: cd server && pnpm prisma generate

      - name: Typecheck server
        run: cd server && pnpm exec tsc --noEmit

      - name: Test server
        run: pnpm test:server

      # CLIENT: fast jsdom unit / component tests (first-class gate) + coverage
      - name: Run jsdom unit & component tests with coverage
        run: pnpm exec vitest run --project jsdom --coverage
        working-directory: client

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./client/coverage/lcov.info
          flags: client

      # LINT & FORMAT
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

  test-storybook:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd client && pnpm exec playwright install chromium

      - name: Install Chromium system dependencies
        run: cd client && pnpm exec playwright install-deps chromium

      - name: Start Storybook
        run: |
          pnpm storybook --no-open &
          for i in $(seq 1 30); do
            if curl -s http://localhost:6006 > /dev/null 2>&1; then
              echo "Storybook ready"
              break
            fi
            sleep 2
          done
        working-directory: client

      - name: Run Storybook tests (Chromium)
        run: pnpm exec vitest run --project storybook-chromium
        working-directory: client
        env:
          STORYBOOK_URL: http://localhost:6006

  build:
    needs: [test, test-storybook]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build client
        run: pnpm build
        working-directory: client
        env:
          VITE_SERVER_URL: https://api.zemonie.site
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAF-F5zDNfACWQAq_
