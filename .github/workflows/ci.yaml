name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - uses: millionco/react-doctor@v2
        with:
          directory: client

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      # SERVER
      - name: Generate Prisma client
        run: cd server && pnpm prisma generate

      - name: Typecheck server
        run: cd server && pnpm exec tsc --noEmit

      - name: Test server
        run: pnpm test:server

      # CLIENT: fast jsdom unit / component tests (first-class gate) + coverage
      - name: Run jsdom unit & component tests with coverage
        run: pnpm exec vitest run --project jsdom --coverage
        working-directory: client

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./client/coverage/lcov.info
          flags: client

      # LINT & FORMAT
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

  test-storybook:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd client && pnpm exec playwright install chromium firefox webkit
      - run: cd client && pnpm exec playwright install-deps

      - name: Start Storybook
        run: |
          pnpm storybook --no-open &
          for i in $(seq 1 30); do
            if curl -s http://localhost:6006 > /dev/null 2>&1; then
              echo "Storybook ready"
              break
            fi
            sleep 2
          done
        working-directory: client

      - name: Run Storybook / Playwright browser tests
        run: pnpm test
        working-directory: client
        env:
          STORYBOOK_URL: http://localhost:6006

  build:
    needs: [test, test-storybook]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build client
        run: pnpm build
        working-directory: client
        env:
          VITE_SERVER_URL: https://api.zemonie.site

  deploy-staging:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Generate Prisma client
        run: cd server && pnpm prisma generate

      - name: Run Prisma migrations (staging)
        run: cd server && pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Deploy server to staging
        run: |
          export CLOUDFLARE_API_TOKEN
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .secrets.env
          printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET" >> .secrets.env
          printf 'BETTER_AUTH_URL=%s\n' "$BETTER_AUTH_URL" >> .secrets.env
          printf 'TRUSTED_ORIGINS=%s\n' "$TRUSTED_ORIGINS" >> .secrets.env
          pnpm wrangler deploy --minify --config wrangler.staging.jsonc --secrets-file .secrets.env
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL_STAGING }}
          TRUSTED_ORIGINS: ${{ secrets.TRUSTED_ORIGINS_STAGING }}

      # Deploy client
      - name: Build client
        run: pnpm build
        working-directory: client
        env:
          VITE_SERVER_URL: https://staging.api.zemonie.site

      - name: Deploy client to staging
        run: pnpm wrangler deploy --minify --config wrangler.staging.toml
        working-directory: client
