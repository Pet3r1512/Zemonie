name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: 22

      - name: Generate Prisma client
        run: cd server && pnpm prisma generate

      - name: Run Prisma migrations (staging)
        run: cd server && pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}

      - name: Deploy server to staging
        run: |
          export CLOUDFLARE_API_TOKEN
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .secrets.env
          printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET" >> .secrets.env
          printf 'BETTER_AUTH_URL=%s\n' "$BETTER_AUTH_URL" >> .secrets.env
          printf 'TRUSTED_ORIGINS=%s\n' "$TRUSTED_ORIGINS" >> .secrets.env
          printf 'TURNSTILE_SECRET=%s\n' "$TURNSTILE_SECRET" >> .secrets.env
          pnpm wrangler deploy --minify --config wrangler.staging.jsonc --secrets-file .secrets.env
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL_STAGING }}
          TRUSTED_ORIGINS: ${{ secrets.TRUSTED_ORIGINS_STAGING }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}

      - name: Build client
        run: pnpm build
        working-directory: client
        env:
          VITE_SERVER_URL: https://staging.api.zemonie.site
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAF-F5zDNfACWQAq_

      - name: Deploy client to staging
        run: pnpm wrangler deploy --minify --config wrangler.staging.toml
        working-directory: client
