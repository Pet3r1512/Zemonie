name: "Setup pnpm + Node"
inputs:
  node-version:
    default: 22
    required: false

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with: { version: 10 }
    - uses: actions/setup-node@v6
      with:
        node-version: {{ inputs.node-version }}
        cache: "pnpm"
    - run: pnpm install --frozen-lockfile
      shell: bash
      